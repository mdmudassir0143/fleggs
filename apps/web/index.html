    <style>
      /* First paint, before any JS: the same egg loader the app shows while it wakes up. */
      body { margin: 0; }
      #boot0 { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; background: linear-gradient(180deg, #5E97D6 0%, #9CC8EE 60%, #DCEEFB 100%); }
      #boot0 svg { width: 140px; height: auto; transform-origin: 50% 92%; animation: b0 2.4s ease-in-out infinite; }
      #boot0 p { margin: 0; font: 700 20px Fredoka, system-ui, sans-serif; color: #14213D; background: rgba(255,255,255,.9); border: 2px solid #14213D; border-radius: 999px; padding: 4px 16px; box-shadow: 0 3px 0 #14213D; }
      @keyframes b0 { 0%, 100% { transform: rotate(0) translateY(0); } 15% { transform: rotate(-9deg); } 30% { transform: rotate(8deg); } 42% { transform: rotate(-4deg); } 55% { transform: scaleY(.94) scaleX(1.05); } 68% { transform: translateY(-26px) scaleY(1.04); } 82% { transform: scaleY(.96) scaleX(1.03); } }
      @media (prefers-reduced-motion: reduce) { #boot0 svg { animation: none; } }
    </style>
